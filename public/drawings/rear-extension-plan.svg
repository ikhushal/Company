<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 64 850 628" width="850" height="628" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title>Illustrative sample: proposed ground floor plan (part)</title>
  <desc>Single-storey rear extension, 6100 by 3900 mm externally, containing a 19.8 square metre kitchen-dining room with bi-fold doors, a window and a roof lantern. Drawn at 70 units per metre. Not a client project.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#5E656C" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="140" y="64" width="850" height="628" fill="#FFFFFF"/>
  <rect x="148" y="72" width="834" height="612" fill="none" stroke="#111417" stroke-width="1.5"/>

  <!-- Existing house (part), cut at a break line -->
  <g fill="url(#hatch)" stroke="#3B4148" stroke-width="1">
    <rect x="200" y="150" width="21" height="110"/>
    <rect x="606" y="150" width="21" height="110"/>
    <rect x="221" y="239" width="49" height="21"/>
    <rect x="557" y="239" width="49" height="21"/>
  </g>
  <path d="M182 150 H398 l6 -9 l8 18 l6 -9 H645" fill="none" stroke="#3B4148" stroke-width="1"/>
  <text x="413.5" y="205" text-anchor="middle" font-size="13" fill="#5E656C">Existing living area</text>
  <line x1="270" y1="249.5" x2="557" y2="249.5" stroke="#111417" stroke-width="1.25" stroke-dasharray="7 5"/>

  <!-- New walls: 300 mm cavity walls -->
  <g fill="#111417">
    <rect x="200" y="260" width="21" height="273"/>
    <rect x="606" y="260" width="21" height="273"/>
    <rect x="221" y="512" width="21" height="21"/>
    <rect x="326" y="512" width="38.5" height="21"/>
    <rect x="574.5" y="512" width="31.5" height="21"/>
  </g>

  <!-- Window, 1200 mm -->
  <g fill="none" stroke="#111417" stroke-width="1">
    <rect x="242" y="512" width="84" height="21" fill="#FFFFFF"/>
    <line x1="242" y1="522.5" x2="326" y2="522.5"/>
  </g>

  <!-- Bi-fold doors, 3000 mm -->
  <polyline points="364.5,533 399.5,551 434.5,533 469.5,551 504.5,533 539.5,551 574.5,533" fill="none" stroke="#111417" stroke-width="1"/>
  <text x="469.5" y="568" text-anchor="middle" font-size="12" fill="#3B4148">Bi-fold doors</text>

  <!-- Kitchen units, sink and hob -->
  <g fill="#F3F4F5" stroke="#3B4148" stroke-width="1">
    <rect x="221" y="260" width="42" height="252"/>
    <rect x="263" y="470" width="77" height="42"/>
    <rect x="266" y="478" width="36" height="26" rx="3" fill="#FFFFFF"/>
  </g>
  <g fill="none" stroke="#3B4148" stroke-width="1">
    <circle cx="234" cy="360" r="5"/>
    <circle cx="250" cy="360" r="5"/>
    <circle cx="234" cy="377" r="5"/>
    <circle cx="250" cy="377" r="5"/>
  </g>

  <!-- Roof lantern over, 2100 x 1500 mm (dashed: above cut plane) -->
  <g fill="none" stroke="#3B4148" stroke-width="1" stroke-dasharray="6 4">
    <rect x="340" y="300" width="147" height="105"/>
    <line x1="340" y1="300" x2="487" y2="405"/>
    <line x1="487" y1="300" x2="340" y2="405"/>
  </g>
  <text x="413.5" y="424" text-anchor="middle" font-size="12" fill="#5E656C">Roof lantern over</text>

  <!-- Room label -->
  <text x="440" y="452" text-anchor="middle" font-size="15" font-weight="600" fill="#111417">Kitchen / dining</text>
  <text x="440" y="471" text-anchor="middle" font-size="13" fill="#3B4148">19.8 m² · 5.5 × 3.6 m internal</text>

  <!-- Note: new opening -->
  <line x1="656" y1="206" x2="545" y2="249" stroke="#3B4148" stroke-width="0.75"/>
  <circle cx="545" cy="249" r="2" fill="#3B4148"/>
  <text x="660" y="203" font-size="12" fill="#3B4148">New 4100 opening formed</text>
  <text x="660" y="219" font-size="12" fill="#3B4148">in existing rear wall</text>

  <!-- Dimensions (mm) -->
  <g stroke="#3B4148" stroke-width="0.75" fill="none">
    <line x1="200" y1="540" x2="200" y2="622"/>
    <line x1="627" y1="540" x2="627" y2="622"/>
    <line x1="242" y1="582" x2="242" y2="598"/>
    <line x1="326" y1="582" x2="326" y2="598"/>
    <line x1="364.5" y1="582" x2="364.5" y2="598"/>
    <line x1="574.5" y1="582" x2="574.5" y2="598"/>
    <line x1="194" y1="590" x2="633" y2="590"/>
    <line x1="194" y1="615" x2="633" y2="615"/>
    <line x1="633" y1="260" x2="676" y2="260"/>
    <line x1="633" y1="533" x2="676" y2="533"/>
    <line x1="668" y1="254" x2="668" y2="539"/>
  </g>
  <g stroke="#111417" stroke-width="1.25">
    <line x1="196" y1="594" x2="204" y2="586"/>
    <line x1="238" y1="594" x2="246" y2="586"/>
    <line x1="322" y1="594" x2="330" y2="586"/>
    <line x1="360.5" y1="594" x2="368.5" y2="586"/>
    <line x1="570.5" y1="594" x2="578.5" y2="586"/>
    <line x1="623" y1="594" x2="631" y2="586"/>
    <line x1="196" y1="619" x2="204" y2="611"/>
    <line x1="623" y1="619" x2="631" y2="611"/>
    <line x1="664" y1="264" x2="672" y2="256"/>
    <line x1="664" y1="537" x2="672" y2="529"/>
  </g>
  <g font-size="12" fill="#3B4148" text-anchor="middle">
    <text x="221" y="585">600</text>
    <text x="284" y="585">1200</text>
    <text x="345.25" y="585">550</text>
    <text x="469.5" y="585">3000</text>
    <text x="600.75" y="585">750</text>
    <text x="413.5" y="610">6100</text>
    <text x="660" y="396.5" transform="rotate(-90 660 396.5)">3900</text>
  </g>

  <!-- North point -->
  <g transform="translate(880 120)">
    <circle r="24" fill="none" stroke="#3B4148" stroke-width="1"/>
    <path d="M0 -18 L7 12 L0 6 L-7 12 Z" fill="#111417"/>
    <text y="-30" text-anchor="middle" font-size="13" font-weight="600" fill="#111417">N</text>
  </g>

  <!-- Key -->
  <g font-size="12" fill="#3B4148">
    <text x="720" y="290" font-size="13" font-weight="600" fill="#111417">Key</text>
    <rect x="720" y="302" width="30" height="12" fill="#111417"/>
    <text x="760" y="312">New wall</text>
    <rect x="720" y="326" width="30" height="12" fill="url(#hatch)" stroke="#3B4148" stroke-width="1"/>
    <text x="760" y="336">Existing wall</text>
    <line x1="720" y1="356" x2="750" y2="356" stroke="#3B4148" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="760" y="360">Above or overhead</text>
  </g>

  <!-- Scale bar: 70 units = 1 m -->
  <g font-size="11" fill="#3B4148">
    <text x="720" y="406" font-size="13" font-weight="600" fill="#111417">Scale</text>
    <rect x="720" y="418" width="70" height="6" fill="#111417"/>
    <rect x="790" y="418" width="70" height="6" fill="#FFFFFF" stroke="#111417" stroke-width="1"/>
    <rect x="860" y="418" width="70" height="6" fill="#111417"/>
    <text x="720" y="440" text-anchor="middle">0</text>
    <text x="790" y="440" text-anchor="middle">1</text>
    <text x="860" y="440" text-anchor="middle">2</text>
    <text x="930" y="440" text-anchor="middle">3 m</text>
  </g>

  <!-- Title block -->
  <g>
    <rect x="700" y="520" width="268" height="155" fill="none" stroke="#111417" stroke-width="1"/>
    <line x1="700" y1="552" x2="968" y2="552" stroke="#111417" stroke-width="0.75"/>
    <line x1="700" y1="592" x2="968" y2="592" stroke="#111417" stroke-width="0.75"/>
    <line x1="700" y1="630" x2="968" y2="630" stroke="#111417" stroke-width="0.75"/>
    <text x="712" y="541" font-size="14" font-weight="600" fill="#111417">Whitestone Civil Engineering</text>
    <text x="712" y="569" font-size="13" font-weight="600" fill="#111417">Proposed ground floor plan (part)</text>
    <text x="712" y="584" font-size="12" fill="#3B4148">Single-storey rear extension</text>
    <text x="712" y="608" font-size="13" font-weight="600" fill="#111417">Illustrative sample</text>
    <text x="712" y="622" font-size="12" fill="#3B4148">Not a client project or address</text>
    <text x="712" y="648" font-size="11" fill="#5E656C">Dimensions in mm. Do not scale.</text>
    <text x="712" y="664" font-size="11" fill="#5E656C">Sheet SAMPLE-01 · Revision A</text>
  </g>
</svg>
